[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helix"
version = "2.0.0"
description = "Personal AI Agent Platform"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Vaibhav Kumar Singh"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "aiofiles>=23.0.0",
    "websockets>=12.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
voice = [
    "piper-tts>=1.4.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.14.0",
    "faster-whisper>=1.0.0",
]
rag = [
    "qdrant-client>=1.7.0",
    "fastembed>=0.3.0",
]
llm = [
    "llama-cpp-python>=0.2.0",
]
llm-transformers = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
all = [
    "helix[voice,rag,test]",
]

[tool.setuptools]
packages = {find = {where = ["."], include = ["user*", "foundation*", "core_ai*", "memory*", "context*", "action*", "api*", "orchestrator*", "scripts*"]}}

[project.scripts]
helix-backend = "scripts.start_backend:main"
helix-frontend = "scripts.start_frontend:main"
helix-all = "scripts.start_all:main"
helix-test = "scripts.run_tests:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
